# Copy to the platform configuration path shown in the README.
database: netprobe.db
concurrency: 32
raw_retention: 336h       # 14 days
rollup_retention: 8760h  # 1 year
incident_window: 5s

targets:
  - name: home-router
    description: Home LAN default gateway
    host: 192.168.1.1
    type: icmp
    interval: 1s
    timeout: 800ms
    tags: [local]

  # These are public DNS resolver addresses operated by different organizations.
  # They use anycast, so they normally route to a nearby site rather than a fixed
  # country. The operator diversity is useful; the addresses do not prove that
  # three different geographic regions are reachable.
  - name: cloudflare
    description: Cloudflare public DNS
    host: 1.1.1.1
    type: icmp
    interval: 1s
    timeout: 800ms
    tags: [public]

  - name: google
    description: Google Public DNS
    host: 8.8.8.8
    type: icmp
    interval: 1s
    timeout: 800ms
    tags: [public]

  - name: quad9
    description: Quad9 public DNS
    host: 9.9.9.9
    type: icmp
    interval: 1s
    timeout: 800ms
    tags: [public]
