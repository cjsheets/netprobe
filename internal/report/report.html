<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>netprobe report</title><style>
:root{color-scheme:light dark;--bg:#fff;--fg:#18212b;--muted:#667085;--grid:#ccd2d9} @media(prefers-color-scheme:dark){:root{--bg:#101418;--fg:#ecf0f4;--muted:#aab3bd;--grid:#38424c}}body{font:14px system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:24px}h1{margin-bottom:4px}.muted{color:var(--muted)}#chart{width:100%;height:440px;border:1px solid var(--grid);touch-action:none}.card{border:1px solid var(--grid);border-radius:8px;padding:12px;margin:12px 0}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--grid)}</style></head><body><h1>netprobe report</h1><div class="muted">{{.From}} — {{.To}} · standalone report · wheel/pinch to zoom, drag to pan</div><canvas id="chart"></canvas><h2>Likely incidents</h2><div id="incidents"></div><h2>Targets</h2><div id="targets"></div><h2>Collection gaps and network changes</h2><div id="gaps"></div><script id="data" type="application/json">{{.Data}}</script><script>
const D=JSON.parse(document.querySelector('#data').textContent),O=[...(D.observations||[]),...(D.rollups||[]).map(r=>({timestamp:r.bucket,target:r.target,success:r.packet_loss<1,packet_loss:r.packet_loss,latency_ms:r.mean_ms}))],C=document.querySelector('#chart'),x=C.getContext('2d');let lo=Date.parse(D.from),hi=Date.parse(D.to),drag,last;const colors=['#3976d6','#e57c23','#7a52c7','#1b998b','#db3a34','#7b8c00'];
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function card(parent,title,body,tail){const d=el('div',undefined,'card');d.append(el('b',title),document.createTextNode(' · '+body),el('br'),document.createTextNode(tail||''));parent.append(d)}
function draw(){let r=C.getBoundingClientRect(),d=devicePixelRatio||1;C.width=r.width*d;C.height=r.height*d;x.scale(d,d);let w=r.width,h=r.height;x.clearRect(0,0,w,h);let names=[...new Set(O.map(o=>o.target))],row=h/Math.max(1,names.length);x.font='12px system-ui';names.forEach((n,i)=>{let y=i*row+row/2;x.fillStyle=getComputedStyle(document.body).color;x.fillText(n,8,y-7);x.strokeStyle=colors[i%colors.length];x.beginPath();let started=false;O.filter(o=>o.target===n&&Date.parse(o.timestamp)>=lo&&Date.parse(o.timestamp)<=hi).forEach(o=>{let px=120+(Date.parse(o.timestamp)-lo)/(hi-lo)*(w-130);if(!o.success){x.fillStyle='#c62828';x.fillRect(px-2,y-3,5,14);started=false}else if(o.latency_ms!=null){let py=y+12-Math.min(24,o.latency_ms/10);started?x.lineTo(px,py):(x.moveTo(px,py),started=true);if(o.packet_loss>0){x.fillStyle='#e57c23';x.fillRect(px-1,y+6,3,6)}}});x.stroke();x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--grid');x.beginPath();x.moveTo(0,(i+1)*row);x.lineTo(w,(i+1)*row);x.stroke()});(D.incidents||[]).forEach(q=>{let a=120+(Date.parse(q.start)-lo)/(hi-lo)*(w-130),b=120+(Date.parse(q.end||q.start)-lo)/(hi-lo)*(w-130);x.fillStyle='rgba(198,40,40,.12)';x.fillRect(a,0,Math.max(3,b-a),h)})}
C.onwheel=e=>{e.preventDefault();let p=(e.offsetX-120)/(C.clientWidth-130),span=hi-lo,f=e.deltaY>0?1.25:.8,center=lo+p*span;lo=center-p*span*f;hi=lo+span*f;draw()};C.onpointerdown=e=>{drag=e.clientX;last=[lo,hi];C.setPointerCapture(e.pointerId)};C.onpointermove=e=>{if(drag==null)return;let dt=(drag-e.clientX)/(C.clientWidth-130)*(last[1]-last[0]);lo=last[0]+dt;hi=last[1]+dt;draw()};C.onpointerup=()=>drag=null;onresize=draw;draw();
const ip=document.querySelector('#incidents');if((D.incidents||[]).length)D.incidents.forEach(i=>card(ip,i.likely_scope,i.start+' — '+(i.end||'active'),i.explanation+' '+i.affected_targets.join(', ')));else ip.append(el('p','None detected.'));const tp=document.querySelector('#targets'),tb=el('table'),hr=document.createElement('tr');['Name','Probe','Destination','Tags'].forEach(v=>hr.append(el('th',v)));tb.append(hr);(D.targets||[]).forEach(t=>{const tr=document.createElement('tr');[t.name,t.probe_type,t.url||t.host||t.resolver,(t.tags||[]).join(', ')].forEach(v=>tr.append(el('td',v)));tb.append(tr)});tp.append(tb);const gp=document.querySelector('#gaps');if((D.gaps||[]).length)D.gaps.forEach(g=>card(gp,g.kind,g.start+' — '+g.end,g.details));else gp.append(el('p','None recorded.'));
</script></body></html>
