name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.x', cache: true}
      - run: go test ./...
      - run: go build -trimpath ./cmd/netprobe
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.x', cache: true}
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/netprobe
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/netprobe
      - run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/netprobe
